<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>대디핏 견적 템플릿</title>
  <style>
    body { font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif; margin: 0; background:#f6f7f9; }
    .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
    .card { background:#fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    h2 { font-size: 14px; margin: 0 0 8px; color:#333; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px){ .grid { grid-template-columns: 1fr; } }

    label { display:block; font-size: 12px; color:#555; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; box-sizing: border-box;
      padding: 10px; border-radius: 10px;
      border: 1px solid #d9dde3; background: #fff;
      font-size: 14px;
    }
    textarea { min-height: 560px; resize: vertical; line-height: 1.55; }

    .row { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    button {
      border: 0; padding: 10px 14px; border-radius: 12px;
      background:#111; color:#fff; font-size: 14px; cursor:pointer;
    }
    button.secondary { background:#e9ecf1; color:#111; }

    .hint { font-size: 12px; color:#666; margin-top: 6px; }
    .mini { font-size: 12px; color:#666; }
    .ok { color: #0a7; font-weight: 600; }
    .muted { color:#999; }

    .qty-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px){ .qty-grid { grid-template-columns: 1fr; } }

    .option-row{
      display:flex; align-items:center; gap:12px;
      padding: 10px 12px;
      border: 1px solid #e6eaf0;
      border-radius: 12px;
      background:#fafbfc;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .option-row .check{
      display:flex; align-items:center; gap:8px;
      min-width: 120px;
      font-size: 13px; color:#222;
      white-space: nowrap;
    }
    .option-row .check input{ width:18px; height:18px; }
    .option-row .field{ flex:1; min-width: 220px; }
    .option-row .field label{ margin:0 0 4px; font-size:12px; color:#555; }
    .option-row .field .sub{ font-size:12px; color:#999; margin-top:4px; }

    .room-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
    .room-list { display:grid; gap:8px; }
    .room-item {
      display:grid;
      grid-template-columns: minmax(120px, 1fr) minmax(110px, 1fr) auto;
      gap:8px;
      align-items:end;
      padding:10px;
      border:1px solid #e6eaf0;
      border-radius:12px;
      background:#fff;
    }
    .room-item button { min-width:64px; padding:10px 12px; }
    @media (max-width: 720px){ .room-item { grid-template-columns: 1fr; } }

    .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .action-row button{ min-width: 96px; }

    select { min-height: 40px; }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="card">
      <h1>대디핏 견적 템플릿</h1>
      <div class="mini muted">
        고객정보 + 시공 희망 공간 + 1200/600 장수 입력 → 카톡용 견적 문구 생성
      </div>
    </div>

    <div class="card">
      <h2>고객 정보</h2>
      <div class="grid">
        <div>
          <label>성함(고객명)</label>
          <input id="customerName" placeholder="고객명" />
        </div>
        <div>
          <label>연락처</label>
          <input id="phone" placeholder="카카오톡 채널 문의" />
        </div>
        <div>
          <label>시공 주소</label>
          <input id="address" placeholder="주소를 입력해 주세요" />
        </div>
        <div>
          <label>평형 / 타입</label>
          <input id="pyeongType" placeholder="예: 33평 A타입" />
        </div>
        <div>
          <label>확장여부</label>
          <select id="extension">
            <option value="베란다 확장">베란다 확장</option>
            <option value="베란다 비확장">베란다 비확장</option>
            <option value="">표시 안 함</option>
          </select>
        </div>
        <div>
          <label>시공 희망 공간</label>
          <select id="areasPreset">
            <option value="">선택하세요</option>
            <option value="거실">거실</option>
            <option value="거실, 복도">거실, 복도</option>
            <option value="거실, 복도, 주방">거실, 복도, 주방</option>
            <option value="거실, 복도, 아일랜드">거실, 복도, 아일랜드</option>
            <option value="거실, 방">거실, 방</option>
            <option value="거실, 복도, 방">거실, 복도, 방</option>
            <option value="직접입력">직접입력</option>
          </select>
        </div>
        <div>
          <label>시공 희망 공간 직접입력</label>
          <input id="areasCustom" placeholder="예: 거실, 복도, 아이방" />
          <div class="hint muted">직접입력 값이 있으면 선택값보다 우선 반영됩니다.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>장수 입력</h2>
      <div class="qty-grid">
        <div>
          <label>1200 장수</label>
          <input id="qty1200" type="number" min="0" step="0.5" placeholder="0" />
          <div class="hint">1200 제품 쿠폰 적용가 계산에 반영됩니다.</div>
        </div>
        <div>
          <label>600 장수</label>
          <input id="qty600" type="number" min="0" step="1" placeholder="0" />
          <div id="hint600" class="hint" style="color:#999;">예상 600장수(1200×4): -</div>
        </div>
      </div>

      <div class="option-row">
        <label class="check">
          <input id="optRoom" type="checkbox" />
          방 추가(옵션)
        </label>

        <div class="field">
          <div class="room-tools">
            <button class="secondary" id="btnAddRoom" type="button" disabled>방 추가</button>
            <div class="sub" id="roomsHint">체크 시 방 이름과 600 장수를 여러 개 추가할 수 있습니다.</div>
          </div>
          <div id="roomList" class="room-list"></div>
        </div>
      </div>

      <div class="action-row">
        <button id="btnGenerate">견적 생성</button>
        <button class="secondary" id="btnCopy">복사</button>
        <button class="secondary" id="btnClear">초기화</button>
        <span id="status" class="mini"></span>
      </div>
    </div>

    <div class="card">
      <h2>출력(카톡용)</h2>
      <textarea id="output" readonly placeholder="견적 생성 버튼을 누르면 여기에 문구가 생성됩니다."></textarea>
    </div>
  </div>

<script>
  const PRODUCTS = [
    {
      title: "대디핏 홈핏 600",
      size: "60cm x 60cm x 2.2cm",
      feature: "깔끔한 기본형 TPU 매트",
      qtyKey: "qty600",
      unitPrice: 24000,
      openPrice: null,
    },
    {
      title: "대디핏 터치핏 600",
      size: "60cm x 60cm x 2.2cm",
      feature: "부드러운 터치감과 미끄럼 방지력이 강화된 프리미엄 라인",
      qtyKey: "qty600",
      unitPrice: 27000,
      openPrice: null,
    },
    {
      title: "홈핏 1200",
      size: "120cm x 120cm x 2.4cm",
      feature: "이음선이 적은 특대형 1200 사이즈",
      qtyKey: "qty1200",
      unitPrice: 99000,
      priceLabel: "공동구매 특가",
    },
    {
      title: "터치핏 1200",
      size: "120cm x 120cm x 2.4cm",
      feature: "특대형 사이즈에 부드러운 표면감과 논슬립 기능을 더한 프리미엄 라인",
      qtyKey: "qty1200",
      unitPrice: 109000,
      priceLabel: "공동구매 특가",
    },
  ];

  const ROOM_PRODUCTS = PRODUCTS.filter((product) => product.qtyKey === "qty600");
  const MAX_ROOMS = 4;

  const $ = (id) => document.getElementById(id);

  function formatWon(n) {
    const v = Number(n);
    if (!isFinite(v)) return "0원";
    return Math.round(v).toLocaleString("ko-KR") + "원";
  }

  function formatQty(qty) {
    const v = Number(qty);
    if (!isFinite(v)) return "0장";
    const s = (Math.round(v * 10) % 10 === 0) ? String(Math.round(v)) : String(v);
    return `${s}장`;
  }

  function safeNum(v) {
    const n = Number(v);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  function setStatus(msg, good) {
    const el = $("status");
    el.textContent = msg;
    el.className = "mini " + (good ? "ok" : "");
    setTimeout(() => { if (el.textContent === msg) el.textContent = ""; }, 2500);
  }

  function getAreas() {
    const custom = $("areasCustom").value.trim();
    const preset = $("areasPreset").value;
    if (custom) return custom;
    if (preset === "직접입력") return "";
    return preset;
  }

  function getPyeongLine() {
    const pyeongType = $("pyeongType").value.trim();
    const extension = $("extension").value;
    if (pyeongType && extension) return `${pyeongType} (${extension})`;
    if (pyeongType) return pyeongType;
    return "";
  }

  function getRoomCount() {
    return document.querySelectorAll(".room-item").length;
  }

  function getRooms() {
    return Array.from(document.querySelectorAll(".room-item")).map((item, index) => {
      const name = item.querySelector(".room-name").value.trim() || `방 ${index + 1}`;
      const qty = safeNum(item.querySelector(".room-qty").value);
      return { name, qty };
    }).filter((room) => room.qty > 0);
  }

  function updateRoomHint() {
    const hint = $("roomsHint");
    if (!hint) return;
    hint.textContent = `체크 시 방 이름과 600 장수를 여러 개 추가할 수 있습니다. (현재 ${getRoomCount()}개 / 최대 ${MAX_ROOMS}개)`;
  }

  function updateRoomButton() {
    const btn = $("btnAddRoom");
    if (!btn) return;
    btn.disabled = !$("optRoom").checked || getRoomCount() >= MAX_ROOMS;
    updateRoomHint();
  }

  function addRoom(name = "", qty = "") {
    if (getRoomCount() >= MAX_ROOMS) return;

    const roomList = $("roomList");
    const roomNo = roomList.children.length + 1;
    const item = document.createElement("div");
    item.className = "room-item";
    item.innerHTML = `
      <div>
        <label>방 이름</label>
        <input class="room-name" placeholder="방 ${roomNo}" value="${name}" />
      </div>
      <div>
        <label>방 600 장수</label>
        <input class="room-qty" type="number" min="0" step="1" placeholder="30" value="${qty}" />
      </div>
      <button class="secondary room-delete" type="button">삭제</button>
    `;

    item.querySelector(".room-name").addEventListener("input", generate);
    item.querySelector(".room-qty").addEventListener("input", generate);
    item.querySelector(".room-delete").addEventListener("click", () => {
      item.remove();
      updateRoomButton();
      generate();
    });

    roomList.appendChild(item);
    updateRoomButton();
  }

  function setRoomOption(on) {
    $("btnAddRoom").disabled = !on;
    if (on && getRoomCount() === 0) addRoom();
    if (!on) $("roomList").innerHTML = "";
    updateRoomButton();
  }

  function collectInput() {
    return {
      customerName: $("customerName").value.trim(),
      phone: $("phone").value.trim() || "카카오톡 채널 문의",
      address: $("address").value.trim(),
      pyeongLine: getPyeongLine(),
      areas: getAreas(),
      qty600: safeNum($("qty600").value),
      qty1200: safeNum($("qty1200").value),
      optRoom: $("optRoom").checked,
      rooms: $("optRoom").checked ? getRooms() : [],
    };
  }

  function productBlock(product, qty) {
    const total = qty * product.unitPrice;
    const priceLabel = product.priceLabel || "행사 기준";

    return `[ ${product.title} ]

▫ 사이즈 : ${product.size}
▫ 제품 특징 : ${product.feature}
▫ ${priceLabel} : 장당 ${formatWon(product.unitPrice)}
▫ 예상 수량 : ${formatQty(qty)}
▫ 총 금액 : ${formatWon(total)}`;
  }

  function roomProductBlock(product, room) {
    const total = room.qty * product.unitPrice;
    const priceLabel = product.priceLabel || "행사 기준";

    return `[ ${room.name} - ${product.title} ]

▫ 사이즈 : ${product.size}
▫ 제품 특징 : ${product.feature}
▫ ${priceLabel} : 장당 ${formatWon(product.unitPrice)}
▫ 예상 수량 : ${formatQty(room.qty)}
▫ 총 금액 : ${formatWon(total)}`;
  }

  function buildEstimate(data) {
    const customerNameLine = data.customerName ? `${data.customerName} 님` : "고객님";
    const qtyByKey = {
      qty600: data.qty600,
      qty1200: data.qty1200,
    };

    const productBlocks = PRODUCTS
      .map((product) => productBlock(product, qtyByKey[product.qtyKey]))
      .join("\n\nㅡ\n\n");
    const roomBlocks = (data.optRoom && data.rooms.length > 0)
      ? `\n\nㅡ\n\n[ 방 추가 견적 ]\n\n${data.rooms.map((room) => ROOM_PRODUCTS.map((product) => roomProductBlock(product, room)).join("\n\nㅡ\n\n")).join("\n\nㅡ\n\n")}`
      : "";

    return `안녕하세요.
층간소음매트 전문 시공 브랜드, 대디핏입니다.

문의주신 내용을 기준으로
고객님 댁에 필요한 예상 시공 견적을 안내드립니다.

대디핏은 아이가 매일 걷고, 뛰고, 생활하는 공간을
아빠의 마음으로 꼼꼼하게 시공해드리는 전문 시공 브랜드입니다.

━━━━━━━━━━━━━━

[ 고객 정보 ]

성함 : ${customerNameLine}
연락처 : ${data.phone}
시공 주소 : ${data.address}
평형 / 타입 : ${data.pyeongLine}
시공 희망 공간 : ${data.areas}

━━━━━━━━━━━━━━

[ 대디핏 오픈 혜택 ]

현재 대디핏 오픈 기념으로
100가구 한정 특가 이벤트가 진행 중입니다.

혜택 1. 특대형 1200 사이즈 특별가 적용
혜택 2. 1년 무상 A/S 지원
혜택 3. 전문 시공팀 방문 시공
혜택 4. 상담 기준 맞춤 견적 안내

※ 이벤트 혜택은 시공일이 아닌 예약일 기준으로 적용됩니다.
※ 한정 수량 마감 시 혜택은 조기 종료될 수 있습니다.

━━━━━━━━━━━━━━

[ 안내사항 ] *중요

✔ 안내드린 수량은 아파트 도면, 평형, 기존 시공 데이터를 기준으로 산출한 예상 수량입니다.
✔ 실제 사용 수량은 현장 구조, 벽면 형태, 몰딩, 문턱, 가구 배치 등에 따라 달라질 수 있습니다.
✔ 최종 결제는 시공 완료 후 실제 사용된 수량을 기준으로 진행됩니다.
✔ 별도 계약금 없이 일정 배정 후 시공 당일 결제로 진행됩니다.
✔ 팬트리, 알파룸, 아이방 등 추가 공간 시공을 원하실 경우 미리 말씀해주시면 함께 안내드리겠습니다.
✔ 현금영수증 및 세금계산서 발행 가능합니다.
✔ 카드 결제 시 수수료 10%가 부가됩니다.
✔ 전문 시공 서비스는 무료로 제공됩니다.
(부분시공 시 출장비 10만원이 발생됩니다)
(부분시공 : 거실만 시공, 방만 시공 등)

━━━━━━━━━━━━━━

[ 예상 제품 구성 ]

${productBlocks}${roomBlocks}

━━━━━━━━━━━━━━

[ 컬러 안내 ]

■ 홈핏 라인
밀크 화이트 / 오트 베이지 / 스톤 그레이

■ 터치핏 라인
스킨 베이지

※ 실제 색상은 조명, 바닥재 색상, 촬영 환경에 따라 차이가 있을 수 있습니다.

━━━━━━━━━━━━━━

아이의 웃음이 더 자유로운 공간,
대디핏이 꼼꼼하게 만들어드리겠습니다.

추가로 궁금하신 점 있으시면 편하게 말씀 주세요.
고객님 공간에 맞춰 가장 적합한 구성으로 안내드리겠습니다.`;
  }

  function update600Hint() {
    const qty1200 = Number($("qty1200").value);
    const hint = $("hint600");
    if (isFinite(qty1200) && qty1200 > 0) hint.textContent = `예상 600장수(1200×4): ${qty1200 * 4}장`;
    else hint.textContent = "예상 600장수(1200×4): -";
  }

  function generate() {
    $("output").value = buildEstimate(collectInput());
    update600Hint();
    setStatus("생성 완료", true);
  }

  async function copyOutput() {
    const text = $("output").value.trim();
    if (!text) { setStatus("복사할 내용이 없어요", false); return; }

    try {
      await navigator.clipboard.writeText(text);
      setStatus("복사 완료", true);
    } catch (e) {
      $("output").focus();
      $("output").select();
      const ok = document.execCommand("copy");
      setStatus(ok ? "복사 완료" : "복사 실패", ok);
      window.getSelection?.().removeAllRanges?.();
    }
  }

  function clearAll() {
    $("customerName").value = "";
    $("phone").value = "";
    $("address").value = "";
    $("pyeongType").value = "";
    $("extension").value = "베란다 확장";
    $("areasPreset").value = "";
    $("areasCustom").value = "";
    $("qty600").value = "";
    $("qty1200").value = "";
    $("optRoom").checked = false;
    setRoomOption(false);
    $("output").value = "";
    update600Hint();
    setStatus("초기화 완료", true);
  }

  $("btnGenerate").addEventListener("click", generate);
  $("btnCopy").addEventListener("click", copyOutput);
  $("btnClear").addEventListener("click", clearAll);
  $("btnAddRoom").addEventListener("click", () => {
    addRoom();
    generate();
  });

  $("optRoom").addEventListener("change", () => {
    setRoomOption($("optRoom").checked);
    generate();
  });

  ["customerName", "phone", "address", "pyeongType", "extension", "areasPreset", "areasCustom", "qty600", "qty1200"].forEach((id) => {
    $(id).addEventListener("input", generate);
    $(id).addEventListener("change", generate);
  });

  update600Hint();
  updateRoomButton();
  generate();
</script>
</body>
</html>
