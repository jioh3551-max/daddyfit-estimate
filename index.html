<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>대디핏 견적 템플릿</title>
  <style>
    html {
      -webkit-text-size-adjust:100%;
      text-size-adjust:100%;
    }
    body {
      font-family: system-ui, -apple-system, Segoe UI, Roboto, "Noto Sans KR", sans-serif;
      margin: 0;
      background:#fff8df;
    }
    .wrap { max-width: 920px; margin: 0 auto; padding: 16px; }
    .card { background:#fff; border-radius: 14px; padding: 14px; box-shadow: 0 2px 10px rgba(0,0,0,.06); margin-bottom: 12px; }
    h1 { font-size: 18px; margin: 0 0 10px; }
    h2 { font-size: 14px; margin: 0 0 8px; color:#333; }
    .grid { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    @media (max-width: 720px){ .grid { grid-template-columns: 1fr; } }

    label { display:block; font-size: 12px; color:#555; margin-bottom: 4px; }
    input, select, textarea {
      width: 100%; box-sizing: border-box;
      padding: 10px; border-radius: 10px;
      border: 1px solid #d9dde3; background: #fff;
      font-size: 14px;
    }
    textarea { min-height: 560px; resize: vertical; line-height: 1.55; }

    .row { display:flex; gap: 10px; flex-wrap: wrap; align-items:center; }
    button {
      border: 0; padding: 10px 14px; border-radius: 12px;
      background:#111; color:#fff; font-size: 14px; cursor:pointer;
    }
    button.secondary { background:#e9ecf1; color:#111; }

    .hint { font-size: 12px; color:#666; margin-top: 6px; }
    .mini { font-size: 12px; color:#666; }
    .ok { color: #0a7; font-weight: 600; }
    .muted { color:#999; }

    .qty-grid { display:grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    @media (max-width: 720px){ .qty-grid { grid-template-columns: 1fr; } }

    .option-row{
      display:flex; align-items:center; gap:12px;
      padding: 10px 12px;
      border: 1px solid #e6eaf0;
      border-radius: 12px;
      background:#fafbfc;
      margin-top: 10px;
      flex-wrap: wrap;
    }
    .option-row .check{
      display:flex; align-items:center; gap:8px;
      min-width: 120px;
      font-size: 13px; color:#222;
      white-space: nowrap;
    }
    .option-row .check input{ width:18px; height:18px; }
    .option-row .field{ flex:1; min-width: 220px; }
    .option-row .field label{ margin:0 0 4px; font-size:12px; color:#555; }
    .option-row .field .sub{ font-size:12px; color:#999; margin-top:4px; }
    .memo-option { align-items:flex-start; }
    .editor-stack .memo-option textarea {
      min-height:76px;
      resize:vertical;
      line-height:1.55;
    }

    .room-tools { display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:8px; }
    .room-list { display:grid; gap:8px; }
    .room-item {
      display:grid;
      grid-template-columns: minmax(120px, 1fr) minmax(110px, 1fr) auto;
      gap:8px;
      align-items:end;
      padding:10px;
      border:1px solid #e6eaf0;
      border-radius:12px;
      background:#fff;
    }
    .room-item button { min-width:64px; padding:10px 12px; }
    @media (max-width: 720px){ .room-item { grid-template-columns: 1fr; } }

    .action-row{ display:flex; gap:10px; flex-wrap:wrap; margin-top:12px; }
    .action-row button{ min-width: 96px; }

    select { min-height: 40px; }

    :root {
      --navy:#062844;
      --navy-2:#0b3b5f;
      --gold:#a96d32;
      --line:#d8e1e9;
      --ink:#111827;
      --muted:#71839a;
    }
    body { background:#edf4f7; color:var(--ink); }
    .wrap {
      max-width:1840px;
      padding:22px 28px;
      display:grid;
      grid-template-columns:520px minmax(0, 1fr);
      gap:28px;
      align-items:start;
    }
    .editor-stack {
      min-width:0;
      position:sticky;
      top:16px;
      padding:18px;
      border:1px solid #dbe5ee;
      border-radius:8px;
      background:#fff;
      box-shadow:0 14px 36px rgba(15,23,42,.08);
    }
    .editor-stack .card {
      padding:0 0 15px;
      margin:0 0 15px;
      border-bottom:1px solid #e2e8f0;
      border-radius:0;
      box-shadow:none;
    }
    .editor-stack .card:last-child { margin-bottom:0; border-bottom:0; }
    .editor-stack h1 { font-size:22px; color:#0f172a; }
    .editor-stack h2 { font-size:15px; color:#0f172a; }
    .editor-stack textarea { min-height:230px; }
    .editor-stack button { border-radius:6px; font-weight:800; }
    .editor-stack .action-row { gap:8px; }
    .editor-stack .action-row button { min-width:0; padding:10px 12px; }
    .preview-stack {
      min-width:0;
      position:sticky;
      top:16px;
      max-height:calc(100vh - 32px);
      overflow:auto;
      overscroll-behavior:contain;
      scrollbar-gutter:stable;
    }
    .mobile-only { display:none; }
    .preview-toolbar {
      min-height:54px;
      padding:0 16px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:12px;
      border:1px solid #dbe5ee;
      border-bottom:0;
      background:#fff;
      color:#0f172a;
      font-size:14px;
      font-weight:900;
    }
    .preview-toolbar .row { gap:8px; }
    .preview-toolbar button { padding:9px 12px; border-radius:6px; font-weight:800; }
    .quote-wrap {
      padding:18px;
      border:1px solid #dbe5ee;
      background:#e7eef5;
      overflow:hidden;
    }
    .quote-scale {
      width:1024px;
      transform:scale(var(--preview-scale, 1));
      transform-origin:top left;
    }
    .quote-sheet {
      width:1024px;
      overflow:hidden;
      background:#fff;
      color:#111827;
      font-family:"Pretendard","Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
      -webkit-text-size-adjust:none;
      text-size-adjust:none;
    }
    .df-header {
      height:235px;
      padding:24px 34px 0;
      color:#fff;
      background:linear-gradient(120deg,#031b30,#073a61 68%,#03192b);
      box-sizing:border-box;
    }
    .df-header-main {
      display:grid;
      grid-template-columns:440px 1fr;
      align-items:center;
      gap:26px;
    }
    .df-brand {
      display:grid;
      grid-template-columns:250px 1fr;
      align-items:center;
      gap:14px;
    }
    .df-brand-logo-wrap {
      position:relative;
      width:250px;
      height:128px;
      overflow:hidden;
    }
    .df-brand-logo {
      position:absolute;
      left:50%;
      top:50%;
      width:250px;
      max-width:none;
      height:auto;
      transform:translate(-50%,-50%);
      object-fit:contain;
    }
    .df-brand-copy {
      margin:0;
      font-size:16px;
      line-height:1.75;
      color:#eef6fc;
    }
    .df-title {
      min-height:116px;
      padding-left:34px;
      border-left:1px solid rgba(202,157,103,.75);
      display:flex;
      flex-direction:column;
      justify-content:center;
    }
    .df-title h2 {
      margin:0;
      padding-bottom:7px;
      color:#fff;
      font-size:48px;
      line-height:1.15;
      letter-spacing:.03em;
      font-weight:900;
      text-shadow:0 1px 2px rgba(0,0,0,.18);
    }
    .df-title p {
      margin:12px 0 0;
      color:#f5c58f;
      font-size:17px;
      line-height:1.6;
      font-weight:700;
    }
    .df-benefits {
      width:520px;
      min-height:72px;
      margin:8px 0 0 auto;
      padding:10px 14px;
      display:grid;
      grid-template-columns:repeat(4,1fr);
      gap:0;
      border:1px solid #d7b184;
      border-radius:10px 10px 0 0;
      background:#fff;
      color:#2e3136;
      box-sizing:border-box;
    }
    .df-benefit {
      padding:0 9px;
      display:flex;
      align-items:center;
      gap:7px;
      border-right:1px solid #ead6bd;
      font-size:10px;
      line-height:1.45;
      font-weight:700;
    }
    .df-benefit:last-child { border-right:0; }
    .df-benefit svg { width:30px; height:30px; flex:none; color:#9c612b; }
    .df-body { padding:16px 34px 0; }
    .df-section { margin-top:16px; }
    .df-section:first-child { margin-top:0; }
    .df-section-title {
      display:inline-flex;
      align-items:center;
      min-width:178px;
      height:40px;
      margin:0;
      padding:0 22px;
      position:relative;
      z-index:2;
      background:var(--navy);
      color:#fff;
      font-size:20px;
      font-weight:900;
      box-sizing:border-box;
      clip-path:polygon(0 0,88% 0,100% 100%,0 100%);
    }
    .df-box {
      margin-top:-1px;
      border:1.5px solid var(--navy);
      border-radius:0 7px 7px 7px;
      background:#fff;
    }
    .df-info-grid {
      display:grid;
      grid-template-columns:1fr 1fr;
      padding:10px 20px;
    }
    .df-info-item {
      min-height:52px;
      padding:10px 12px;
      display:grid;
      grid-template-columns:28px 118px 1fr;
      gap:8px;
      align-items:center;
      border-bottom:1px solid #decfc1;
      box-sizing:border-box;
    }
    .df-info-item:nth-child(odd) { border-right:1px solid #decfc1; }
    .df-info-item:nth-last-child(-n+2) { border-bottom:0; }
    .df-check { font-size:20px; color:var(--navy); font-weight:900; }
    .df-info-label { font-weight:900; color:#14253b; }
    .df-info-value { font-size:15px; line-height:1.5; color:#20242a; word-break:keep-all; }
    .df-plan-layout {
      min-height:290px;
      padding:16px 18px;
      display:grid;
      grid-template-columns:minmax(0, 1fr) 185px;
      gap:18px;
      align-items:stretch;
    }
    .df-plan-frame {
      min-height:250px;
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border:1px solid #b8c4cf;
      background:#fff;
    }
    .df-plan-frame img {
      width:100%;
      height:260px;
      display:block;
      object-fit:contain;
      transform-origin:center;
    }
    .df-onsite {
      padding:14px 14px 10px;
      border:1px solid var(--navy);
      border-radius:7px;
      background:#fff;
    }
    .df-onsite h4 {
      margin:-14px -14px 12px;
      padding:11px 12px;
      border-radius:6px 6px 0 0;
      background:var(--navy);
      color:#fff;
      text-align:center;
      font-size:14px;
    }
    .df-onsite-row { padding:7px 0; font-size:13px; }
    .df-onsite-lines { margin-top:12px; border-top:1px dashed #9ba7b2; height:34px; border-bottom:1px dashed #9ba7b2; }
    .df-table {
      width:100%;
      border-collapse:collapse;
      table-layout:fixed;
      font-size:13px;
    }
    .df-table th,.df-table td {
      padding:10px 8px;
      border:1px solid #7e8d9a;
      text-align:center;
      line-height:1.4;
    }
    .df-table th { background:#f8f4ee; color:#172332; font-weight:900; }
    .df-table td { color:#20242a; }
    .df-table td strong { color:#071f35; font-weight:900; }
    .df-table-note { margin:8px 18px 10px; font-size:11px; color:#4b5563; }
    .df-room-table { margin-top:10px; }
    .df-notice-grid {
      padding:15px 20px;
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:0 28px;
    }
    .df-notice-column + .df-notice-column { border-left:1px solid #d9b994; padding-left:28px; }
    .df-notice-item {
      margin:0 0 10px;
      display:grid;
      grid-template-columns:18px 1fr;
      gap:5px;
      font-size:12px;
      line-height:1.55;
    }
    .df-memo { min-height:80px; padding:14px 20px; }
    .df-memo-line { height:27px; border-bottom:1px dashed #aeb7c0; }
    .df-memo-text {
      font-size:13px;
      line-height:1.65;
      color:#263645;
      white-space:normal;
      overflow-wrap:anywhere;
    }
    .df-footer {
      min-height:118px;
      margin-top:16px;
      padding:12px 34px 10px;
      box-sizing:border-box;
      background:var(--navy);
      color:#fff;
      font-size:13px;
    }
    .df-footer-main {
      display:grid;
      grid-template-columns:1fr 1fr 1.35fr;
      gap:0;
      align-items:center;
    }
    .df-footer-item {
      min-height:44px;
      padding:0 22px;
      display:flex;
      align-items:center;
      gap:12px;
      border-right:1px solid rgba(221,174,119,.7);
    }
    .df-footer-item:last-child { border-right:0; }
    .df-footer-item svg { width:34px; height:34px; flex:none; }
    .df-footer-business {
      margin-top:9px;
      padding-top:8px;
      border-top:1px solid rgba(255,255,255,.24);
      color:rgba(255,255,255,.82);
      font-size:9.5px;
      line-height:1.55;
      text-align:center;
      letter-spacing:0;
    }
    .plan-control {
      margin-top:10px;
      padding:10px;
      border:1px solid #e2e8f0;
      border-radius:7px;
      background:#fbfdff;
    }
    .plan-control-head { display:flex; justify-content:space-between; margin-bottom:6px; color:#71839a; font-size:12px; font-weight:800; }
    #planScale { padding:0; accent-color:var(--navy); }
    @media (max-width:1000px) {
      .wrap { display:block; padding:12px; }
      .editor-stack {
        position:static;
        margin-bottom:14px;
      }
      .mobile-only { display:inline-flex; }
      .preview-stack {
        display:none;
        position:static;
        max-height:none;
        overflow:visible;
      }
      .preview-stack.mobile-open,
      .preview-stack.capture-active {
        display:block;
      }
      .preview-stack.capture-active {
        position:fixed;
        left:-12000px;
        top:0;
        width:1100px;
      }
      .quote-wrap { padding:10px; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <div class="editor-stack">
    <div class="card">
      <h1>대디핏 견적 템플릿</h1>
      <div class="mini muted">
        고객정보 + 시공 희망 공간 + 1200/600 장수 입력 → 카톡용 견적 문구 생성
      </div>
    </div>

    <div class="card">
      <h2>고객 정보</h2>
      <div class="grid">
        <div>
          <label>성함(고객명)</label>
          <input id="customerName" placeholder="고객명" />
        </div>
        <div>
          <label>연락처</label>
          <input id="phone" placeholder="카카오톡 채널 문의" />
        </div>
        <div>
          <label>시공 주소</label>
          <input id="address" placeholder="주소를 입력해 주세요" />
        </div>
        <div>
          <label>평형 / 타입</label>
          <input id="pyeongType" placeholder="예: 33평 A타입" />
        </div>
        <div>
          <label>확장여부</label>
          <select id="extension">
            <option value="베란다 확장">베란다 확장</option>
            <option value="베란다 비확장">베란다 비확장</option>
            <option value="">표시 안 함</option>
          </select>
        </div>
        <div>
          <label>시공 희망 공간</label>
          <select id="areasPreset">
            <option value="">선택하세요</option>
            <option value="거실">거실</option>
            <option value="거실, 복도">거실, 복도</option>
            <option value="거실, 복도, 주방">거실, 복도, 주방</option>
            <option value="거실, 복도, 아일랜드">거실, 복도, 아일랜드</option>
            <option value="거실, 방">거실, 방</option>
            <option value="거실, 복도, 방">거실, 복도, 방</option>
            <option value="직접입력">직접입력</option>
          </select>
        </div>
        <div>
          <label>시공 희망 공간 직접입력</label>
          <input id="areasCustom" placeholder="예: 거실, 복도, 아이방" />
          <div class="hint muted">직접입력 값이 있으면 선택값보다 우선 반영됩니다.</div>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>장수 입력</h2>
      <div class="qty-grid">
        <div>
          <label>1200 장수</label>
          <input id="qty1200" type="number" min="0" step="0.5" placeholder="0" />
        </div>
        <div>
          <label>600 장수</label>
          <input id="qty600" type="number" min="0" step="1" placeholder="0" />
          <div id="hint600" class="hint" style="color:#999;">예상 600장수(1200×4): -</div>
        </div>
      </div>

      <div class="option-row">
        <label class="check">
          <input id="optRoom" type="checkbox" />
          방 추가(옵션)
        </label>

        <div class="field">
          <div class="room-tools">
            <button class="secondary" id="btnAddRoom" type="button" disabled>방 추가</button>
            <div class="sub" id="roomsHint">체크 시 방 이름과 600 장수를 여러 개 추가할 수 있습니다.</div>
          </div>
          <div id="roomList" class="room-list"></div>
        </div>
      </div>

      <div class="option-row memo-option">
        <label class="check">
          <input id="optMemo" type="checkbox" />
          메모 추가
        </label>
        <div class="field" id="memoInputWrap" hidden>
          <label for="memoText">메모 내용</label>
          <textarea id="memoText" placeholder="견적서에 표시할 내용을 입력하세요."></textarea>
        </div>
      </div>

      <div class="action-row">
        <button id="btnGenerate" type="button">견적 생성</button>
        <button class="secondary" id="btnCopy">복사</button>
        <button class="secondary" id="btnCopyImage" type="button">이미지 복사</button>
        <button class="secondary" id="btnDownloadImage" type="button">PNG 저장</button>
        <button class="secondary mobile-only" id="btnTogglePreview" type="button">미리보기 보기</button>
        <button class="secondary" id="btnClear">초기화</button>
        <span id="status" class="mini"></span>
      </div>
    </div>

    <div class="card">
      <h2>시공 범위 도면</h2>
      <div>
        <label for="planImage">이미지 업로드</label>
        <input id="planImage" type="file" accept="image/*" />
      </div>
      <div class="plan-control">
        <div class="plan-control-head">
          <span>도면 크기</span>
          <output id="planScaleValue" for="planScale">100%</output>
        </div>
        <input id="planScale" type="range" min="60" max="200" step="5" value="100" />
      </div>
      <div class="action-row">
        <button class="secondary" id="btnClearImage" type="button">이미지 제거</button>
      </div>
      <div class="hint">이미지를 넣지 않으면 견적서에서 시공 범위 확인 영역이 보이지 않습니다.</div>
    </div>

    <div class="card">
      <h2>출력(카톡용)</h2>
      <textarea id="output" readonly placeholder="견적 생성 버튼을 누르면 여기에 문구가 생성됩니다."></textarea>
    </div>
    </div>

    <div class="preview-stack">
      <div class="preview-toolbar">
        <span>대디핏 견적서 이미지</span>
        <div class="row">
          <button id="previewCopyImage" type="button">이미지 복사</button>
          <button id="previewDownloadImage" class="secondary" type="button">PNG 저장</button>
        </div>
      </div>
      <div class="quote-wrap">
        <div class="quote-scale" id="quoteScale">
          <article class="quote-sheet" id="quoteSheet"></article>
        </div>
      </div>
    </div>
  </div>

<script src="./html2canvas.min.js"></script>
<script>
  const PRODUCTS = [
    {
      title: "대디핏 홈핏 600",
      size: "60cm x 60cm x 2.2cm",
      feature: "깔끔한 기본형 TPU 매트",
      qtyKey: "qty600",
      unitPrice: 24000,
      openPrice: null,
    },
    {
      title: "대디핏 터치핏 600",
      size: "60cm x 60cm x 2.2cm",
      feature: "부드러운 터치감과 미끄럼 방지력이 강화된 프리미엄 라인",
      qtyKey: "qty600",
      unitPrice: 27000,
      openPrice: null,
    },
    {
      title: "홈핏 1200",
      size: "120cm x 120cm x 2.4cm",

    const v = Number(n);
    if (!isFinite(v)) return "0원";
    return Math.round(v).toLocaleString("ko-KR") + "원";
  }

  function formatQty(qty) {
    const v = Number(qty);
    if (!isFinite(v)) return "0장";
    const s = (Math.round(v * 10) % 10 === 0) ? String(Math.round(v)) : String(v);
    return `${s}장`;
  }

  function safeNum(v) {
    const n = Number(v);
    return (isFinite(n) && n > 0) ? n : 0;
  }

  function setStatus(msg, good) {
    const el = $("status");
    el.textContent = msg;

  function getAreas() {
    const custom = $("areasCustom").value.trim();
    const preset = $("areasPreset").value;

    return preset;

    const pyeongType = $("pyeongType").value.trim();

    if (pyeongType) return pyeongType;
    return "";
  }

    return document.querySelectorAll(".room-item").length;

      const qty = safeNum(item.querySelector(".room-qty").value);
      return { name, qty };

    if (getRoomCount() >= MAX_ROOMS) return;

    const roomList = $("roomList");

    const item = document.createElement("div");
    item.className = "room-item";

      <button class="secondary room-delete" type="button">삭제</button>

    item.querySelector(".room-name").addEventListener("input", generate);
    item.querySelector(".room-qty").addEventListener("input", generate);

✔ 최종 결제는 시공 완료 후 실제 사용된 수량을 기준으로 진행됩니다.
✔ 별도 계약금 없이 일정 배정 후 시공 당일 결제로 진행됩니다.
✔ 팬트리, 알파룸, 아이방 등 추가 공간 시공을 원하실 경우 미리 말씀해주시면 함께 안내드리겠습니다.

  }

  function update600Hint() {
    const qty1200 = Number($("qty1200").value);
    const hint = $("hint600");
    if (isFinite(qty1200) && qty1200 > 0) hint.textContent = `예상 600장수(1200×4): ${qty1200 * 4}장`;
    else hint.textContent = "예상 600장수(1200×4): -";
  }

  function updatePreviewScale() {
    const sheet = $("quoteSheet");
    const scaleEl = $("quoteScale");
    const wrap = sheet?.closest(".quote-wrap");
    if (!sheet || !scaleEl || !wrap) return;
    const style = getComputedStyle(wrap);
    const available = Math.max(320, wrap.clientWidth - parseFloat(style.paddingLeft) - parseFloat(style.paddingRight));
    const scale = Math.min(1, available / 1024);
    scaleEl.style.setProperty("--preview-scale", String(scale));
    wrap.style.height = `${Math.ceil(sheet.offsetHeight * scale + parseFloat(style.paddingTop) + parseFloat(style.paddingBottom))}px`;
  }

  function queuePreviewScale() {
    requestAnimationFrame(() => {
      updatePreviewScale();
      $("quoteSheet")?.querySelectorAll("img").forEach((img) => {
        if (!img.complete) img.addEventListener("load", updatePreviewScale, { once:true });
      });
      requestAnimationFrame(updatePreviewScale);
    });
  }

  function waitForNextPaint() {
    return new Promise((resolve) => requestAnimationFrame(() => requestAnimationFrame(resolve)));
  }

  async function waitForQuoteReady(root) {
    if (document.fonts?.ready) await document.fonts.ready;
    await Promise.all(Array.from(root.querySelectorAll("img")).map((img) => {
      if (img.complete) return Promise.resolve();
      return new Promise((resolve) => {
        img.addEventListener("load", resolve, { once:true });
        img.addEventListener("error", resolve, { once:true });
      });
    }));
    await waitForNextPaint();
  }

  function handlePlanImage(file) {
    if (uploadedImageUrl) URL.revokeObjectURL(uploadedImageUrl);
    uploadedImageUrl = file ? URL.createObjectURL(file) : "";
    renderQuotePreview(collectInput());
  }

  function updatePlanScale() {
    const value = Number($("planScale").value) || 100;
    $("planScaleValue").textContent = `${value}%`;
    renderQuotePreview(collectInput());
  }

  async function captureQuoteCanvas() {
    if (!window.html2canvas) throw new Error("이미지 변환 도구를 불러오지 못했습니다.");
    const source = $("quoteSheet");
    await waitForQuoteReady(source);
    const host = document.createElement("div");
    const captureSheet = source.cloneNode(true);
    captureSheet.id = "quoteSheetCapture";
    Object.assign(host.style, {
      position:"fixed",
      left:"-12000px",
      top:"0",
      zIndex:"-2147483647",
      width:"1024px",
      background:"#ffffff",
      pointerEvents:"none"
    });
    Object.assign(captureSheet.style, {
      width:"1024px",
      maxWidth:"none",
      margin:"0",
      transform:"none",
      webkitTextSizeAdjust:"100%",
      textSizeAdjust:"100%"
    });
    host.appendChild(captureSheet);
    document.body.appendChild(host);
    await waitForQuoteReady(captureSheet);
    try {
      const captureHeight = Math.ceil(captureSheet.scrollHeight);
      return await html2canvas(captureSheet, {
        backgroundColor:"#ffffff",
        scale:2,
        width:1024,
        height:captureHeight,
        windowWidth:1200,
        windowHeight:Math.max(1400, captureHeight),
        scrollX:0,
        scrollY:0,
        useCORS:true,
        logging:false,
        onclone:(clonedDocument) => {
          const clonedSheet = clonedDocument.getElementById("quoteSheetCapture");
          if (!clonedSheet) return;
          clonedSheet.style.width = "1024px";
          clonedSheet.style.maxWidth = "none";
          clonedSheet.style.transform = "none";
          clonedSheet.style.webkitTextSizeAdjust = "100%";
          clonedSheet.style.textSizeAdjust = "100%";
        }
      });
    } finally {
      host.remove();
    }
  }

  function toggleMobilePreview() {
    const preview = document.querySelector(".preview-stack");
    if (!preview) return;
    const isOpen = preview.classList.toggle("mobile-open");
    $("btnTogglePreview").textContent = isOpen ? "미리보기 닫기" : "미리보기 보기";
    if (isOpen) queuePreviewScale();
  }

  function canvasToBlob(canvas) {
    return new Promise((resolve) => canvas.toBlob(resolve, "image/png", 1));
  }

  function quoteBlobPromise() {
    return captureQuoteCanvas()
      .then(canvasToBlob)
      .then((blob) => {
        if (!blob) throw new Error("PNG 생성 실패");
        return blob;
      });
  }

  function quoteFileName() {
    const customer = $("customerName").value.trim().replace(/[\\/:*?"<>|]/g, "") || "고객";
    return `daddyfit-estimate-${customer}.png`;
  }

  function downloadBlob(blob, name) {
    const url = URL.createObjectURL(blob);
    const anchor = document.createElement("a");
    anchor.href = url;
    anchor.download = name;
    document.body.appendChild(anchor);
    anchor.click();
    anchor.remove();
    setTimeout(() => URL.revokeObjectURL(url), 60000);
  }

  async function shareImageBlob(blob, fileName) {
    if (!navigator.share || !navigator.canShare || typeof File === "undefined") return false;
    const file = new File([blob], fileName, { type:"image/png" });
    if (!navigator.canShare({ files:[file] })) return false;
    try {
      await navigator.share({ files:[file], title:"대디핏 견적서" });
      return true;
    } catch (error) {
      console.warn("Image sharing unavailable", error);
      return false;
    }
  }

  function isAppleMobile() {
    return /iPhone|iPad|iPod/i.test(navigator.userAgent)
      || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
  }

  async function copyQuoteImage() {
    generate();
    const blobPromise = quoteBlobPromise();
    try {
      if (navigator.clipboard && window.ClipboardItem) {
        await navigator.clipboard.write([new ClipboardItem({ "image/png":blobPromise })]);
        setStatus("이미지 복사 완료", true);
        return;
      }
    } catch (error) {
      console.warn("Clipboard image copy unavailable", error);
    }

    try {
      const blob = await blobPromise;
      if (await shareImageBlob(blob, quoteFileName())) {
        setStatus("이미지 공유창을 열었습니다.", true);
      } else {
        downloadBlob(blob, quoteFileName());
        setStatus("복사 미지원 브라우저라 PNG로 저장했습니다.", true);
      }
    } catch (error) {
      console.error(error);
      setStatus("이미지 생성에 실패했습니다.", false);
    }
  }

  async function downloadQuoteImage() {
    try {
      generate();
      const blob = await quoteBlobPromise();
      if (isAppleMobile() && await shareImageBlob(blob, quoteFileName())) {
        setStatus("공유 메뉴에서 이미지 저장을 선택해주세요.", true);
        return;
      }
      downloadBlob(blob, quoteFileName());
      setStatus("PNG 저장 완료", true);
    } catch (error) {
      console.error(error);
      setStatus("PNG 저장 실패", false);
    }
  }

  function generate() {
    const data = collectInput();
    $("output").value = buildEstimate(data);
    renderQuotePreview(data);
    update600Hint();
    setStatus("생성 완료", true);
  }

  async function copyOutput() {
    const text = $("output").value.trim();
    if (!text) { setStatus("복사할 내용이 없어요", false); return; }

    try {
      await navigator.clipboard.writeText(text);
      setStatus("복사 완료", true);
    } catch (e) {
      $("output").focus();
      $("output").select();
      const ok = document.execCommand("copy");
      setStatus(ok ? "복사 완료" : "복사 실패", ok);
      window.getSelection?.().removeAllRanges?.();
    }
  }

  function clearAll() {
    $("customerName").value = "";
    $("phone").value = "";
    $("address").value = "";
    $("pyeongType").value = "";
    $("extension").value = "베란다 확장";
    $("areasPreset").value = "";
    $("areasCustom").value = "";
    $("qty600").value = "";
    $("qty1200").value = "";
    $("optRoom").checked = false;
    setRoomOption(false);
    $("optMemo").checked = false;
    $("memoText").value = "";
    setMemoOption(false);
    $("planImage").value = "";
    $("planScale").value = "100";
    $("planScaleValue").textContent = "100%";
    handlePlanImage(null);
    $("output").value = "";
    update600Hint();
    setStatus("초기화 완료", true);
  }

  $("btnGenerate").addEventListener("click", generate);
  $("btnCopy").addEventListener("click", copyOutput);
  $("btnCopyImage").addEventListener("click", copyQuoteImage);
  $("previewCopyImage").addEventListener("click", copyQuoteImage);
  $("btnDownloadImage").addEventListener("click", downloadQuoteImage);
  $("previewDownloadImage").addEventListener("click", downloadQuoteImage);
  $("btnTogglePreview").addEventListener("click", toggleMobilePreview);
  $("btnClear").addEventListener("click", clearAll);
  $("btnAddRoom").addEventListener("click", () => {
    addRoom();
    generate();
  });

  $("optRoom").addEventListener("change", () => {
    setRoomOption($("optRoom").checked);
    generate();
  });
  $("optMemo").addEventListener("change", () => {
    setMemoOption($("optMemo").checked);
    generate();
  });
  $("memoText").addEventListener("input", generate);

  $("planImage").addEventListener("change", (event) => handlePlanImage(event.target.files[0]));
  $("btnClearImage").addEventListener("click", () => {
    $("planImage").value = "";
    handlePlanImage(null);
    setStatus("이미지를 제거했습니다.", true);
  });
  $("planScale").addEventListener("input", updatePlanScale);
  window.addEventListener("resize", updatePreviewScale);

  ["customerName", "phone", "address", "pyeongType", "extension", "areasPreset", "areasCustom", "qty600", "qty1200"].forEach((id) => {
    $(id).addEventListener("input", generate);
    $(id).addEventListener("change", generate);
  });

  update600Hint();
  updateRoomButton();
  setMemoOption(false);
  generate();
</script>
